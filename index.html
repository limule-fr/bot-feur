<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feur-Mania - Tableau de bord</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #162447;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,.3);
        }

        h1 { color: #e43f5a; margin-bottom: 5px; }
        h2 { margin-top: 28px; }

        .subtitle {
            color: #8a99ad;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .counter-box, .chart-container, .ranking-item {
            background: #1f4068;
            border-radius: 8px;
        }

        .counter-box {
            padding: 15px;
            font-weight: bold;
        }

        .counter-box span {
            display: block;
            color: #e43f5a;
            font-size: 1.3em;
            margin-top: 5px;
        }

        .chart-container {
            padding: 20px;
            margin-top: 15px;
            min-height: 340px;
            display: flex;
            justify-content: center;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        .ranking-item {
            padding: 15px;
            margin-bottom: 12px;
        }

        .main-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username {
            font-weight: bold;
            font-size: 1.1em;
        }

        .total-count {
            background: #e43f5a;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: .85em;
            font-weight: bold;
        }

        .details-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: .75em;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .badge-feur { background: #4ecc71; }
        .badge-pourquoi { background: #3498db; }
        .badge-moderation { background: #f1c40f; color: #000; }
        .badge-signalement { background: #e74c3c; }
        .badge-autre { background: #9b59b6; }

        .loading {
            color: #8a99ad;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>FEUR-MANIA</h1>
    <div class="subtitle">Tableau de bord des statistiques du bot Discord</div>

    <div class="stats-grid">
        <div class="counter-box">
            Événements détectés
            <span id="total-events">0</span>
        </div>

        <div class="counter-box">
            Utilisateur le plus actif
            <span id="top-user">Personne...</span>
        </div>
    </div>

    <h2>Répartition des événements</h2>

    <div class="chart-container">
        <canvas id="feurChart" width="300" height="300"></canvas>
    </div>

    <h2>Classement détaillé</h2>

    <div id="loading" class="loading">
        Chargement des statistiques...
    </div>

    <ul class="ranking-list" id="ranking-list"></ul>
</div>

<script>
    const API_URL = "/api/stats";
    let chartInstance = null;

    async function fetchStats() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            document.getElementById("loading").style.display = "none";

            const list = document.getElementById("ranking-list");
            list.innerHTML = "";

            const medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"];

            let totalFeur = 0;
            let totalPourquoi = 0;
            let totalModeration = 0;
            let totalSignalement = 0;
            let totalAutre = 0;

            if (data.ranking && data.ranking.length > 0) {
                const topUser = data.ranking[0];

                document.getElementById("top-user").innerText =
                    `${topUser.username} (${topUser.count})`;
            }

            data.ranking.forEach((user, index) => {
                totalFeur += user.feur || 0;
                totalPourquoi += user.pourquoi || 0;
                totalModeration += user.moderation || 0;
                totalSignalement += user.signalement || 0;
                totalAutre += user.autre || 0;

                const li = document.createElement("li");
                li.className = "ranking-item";

                li.innerHTML = `
                    <div class="main-info">
                        <div class="user-info">
                            <span>${medals[index] || "👤"}</span>
                            <span class="username">${user.username}</span>
                        </div>
                        <span class="total-count">${user.count} événements</span>
                    </div>

                    <div class="details-box">
                        <span class="badge badge-feur">
                            Quoi/Feur : ${user.feur}
                        </span>

                        <span class="badge badge-pourquoi">
                            Pourquoi : ${user.pourquoi}
                        </span>

                        <span class="badge badge-moderation">
                            Démo/modération : ${user.moderation}
                        </span>

                        <span class="badge badge-signalement">
                            Signalement : ${user.signalement}
                        </span>

                        <span class="badge badge-autre">
                            Autre : ${user.autre}
                        </span>
                    </div>
                `;

                list.appendChild(li);
            });

            document.getElementById("total-events").innerText =
                data.total || 0;

            const ctx = document.getElementById("feurChart").getContext("2d");

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: "radar",
                data: {
                    labels: [
                        "Quoi/Feur",
                        "Pourquoi",
                        "Démo/Modération",
                        "Signalement",
                        "Autre"
                    ],
                    datasets: [{
                        label: "Événements",
                        data: [
                            totalFeur,
                            totalPourquoi,
                            totalModeration,
                            totalSignalement,
                            totalAutre
                        ],
                        backgroundColor: "rgba(228, 63, 90, 0.25)",
                        borderColor: "#e43f5a",
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: false,
                    animation: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            pointLabels: {
                                color: "#fff",
                                font: { size: 13, weight: "bold" }
                            },
                            ticks: {
                                color: "#8a99ad",
                                backdropColor: "transparent"
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        } catch (error) {
            console.error("Erreur :", error);
            document.getElementById("loading").innerText =
                "Impossible de charger les statistiques.";
        }
    }

    fetchStats();
</script>
</body>
</html>
