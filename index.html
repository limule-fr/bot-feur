<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feur-Mania - Statistiques Détaillées</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
        }

    .container {
        background-color: #162447;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 650px;
        text-align: center;
    }

    h1 {
        color: #e43f5a;
        margin-bottom: 5px;
    }

    .subtitle {
        color: #8a99ad;
        margin-bottom: 25px;
        font-size: 0.9em;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 25px;
    }

    .counter-box {
        background-color: #1f4068;
        padding: 15px;
        border-radius: 8px;
        font-size: 1.1em;
        font-weight: bold;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .counter-box span {
        color: #e43f5a;
        font-size: 1.3em;
        margin-top: 5px;
    }

    .counter-box.aura span {
        color: #00d2fc;
    }

    .chart-container {
        background-color: #1f4068;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 340px;
    }

    .ranking-list {
        list-style: none;
        padding: 0;
        margin: 0;
        text-align: left;
    }

    .ranking-item {
        display: flex;
        flex-direction: column;
        background-color: #1f4068;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 8px;
        transition: transform 0.2s;
    }

    .ranking-item:hover {
        transform: scale(1.01);
    }

    .main-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .rank {
        font-weight: bold;
        width: 25px;
    }

    .username {
        font-weight: bold;
        font-size: 1.1em;
    }

    .total-count {
        background-color: #e43f5a;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85em;
        font-weight: bold;
    }

    .details-box {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .badge {
        font-size: 0.75em;
        padding: 3px 8px;
        border-radius: 4px;
        font-weight: 500;
    }

    .badge-feur {
        background-color: #4ecc71;
        color: #fff;
    }

    .badge-pourquoi {
        background-color: #3498db;
        color: #fff;
    }

    .badge-sexuel {
        background-color: #f1c40f;
        color: #000;
    }

    .badge-raciste {
        background-color: #e74c3c;
        color: #fff;
    }

    .badge-autre {
        background-color: #9b59b6;
        color: #fff;
    }

    .loading {
        color: #8a99ad;
        font-style: italic;
    }
        footer {
            width: 100%;
            margin-top: auto;
            padding: 20px 0;
            text-align: center;
            background: #11182e;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        footer a {
            color: #b8c7ff;
            text-decoration: none;
            margin: 0 12px;
            font-size: 14px;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
</style>

</head>

<body>

<div class="container">
    <h1>📊 FEUR-MANIA</h1>

<div class="subtitle">
    Le classement public et détaillé du serveur
</div>

<div class="stats-grid">
    <div class="counter-box">
        🎯 Infractions globales
        <span id="total-crimes">0</span>
    </div>

    <div class="counter-box aura">
        👑 Aura Farmeur (+999 aura)
        <span id="aura-user">Personne...</span>
    </div>
</div>

<h2>📊 Répartition des fautes</h2>

<div class="chart-container">
    <canvas id="feurChart" width="300" height="300"></canvas>
</div>

<h2>🏆 Tableau des scores détaillé</h2>

<div id="loading" class="loading">
    Chargement des statistiques...
</div>

<ul class="ranking-list" id="ranking-list"></ul>

</div>

<script>
    const API_URL = '/api/stats';
    let feurChartInstance = null;

    async function fetchStats() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            document.getElementById('loading').style.display = 'none';

            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            const medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"];

            let VraiTotalGlobal = 0;

            let totalFeur = 0;
            let totalPourquoi = 0;
            let totalSexuel = 0;
            let totalRaciste = 0;
            let totalAutre = 0;

            let auraUser = "Personne...";

            if (data.ranking && data.ranking.length > 0) {
                const lastUser = data.ranking[data.ranking.length - 1];
                auraUser = `${lastUser.username} (${lastUser.count} 🔥)`;
            }

            document.getElementById('aura-user').innerText = auraUser;

            data.ranking.forEach((user, index) => {
                VraiTotalGlobal += (user.count || 0);

                totalFeur += (user.feur || 0);
                totalPourquoi += (user.pourquoi || 0);
                totalSexuel += (user.sexuel || 0);
                totalRaciste += (user.raciste || 0);
                totalAutre += (user.autre || 0);

                const medal = medals[index] || "👤";

                const li = document.createElement('li');
                li.className = 'ranking-item';

                li.innerHTML = `
                    <div class="main-info">
                        <div class="user-info">
                            <span class="rank">${medal}</span>
                            <span class="username">${user.username}</span>
                        </div>

                        <span class="total-count">
                            ${user.count} fautes
                        </span>
                    </div>

                    <div class="details-box">
                        <span class="badge badge-feur">
                            🗣️ Quoi/Feur : ${user.feur}
                        </span>

                        <span class="badge badge-pourquoi">
                            ❓ Pourquoi : ${user.pourquoi}
                        </span>

                        <span class="badge badge-sexuel">
                            🐷 Sexuel : ${user.sexuel}
                        </span>

                        <span class="badge badge-raciste">
                            🚨 Raciste : ${user.raciste}
                        </span>

                        <span class="badge badge-autre">
                            ⚙️ Autre : ${user.autre}
                        </span>
                    </div>
                `;

                list.appendChild(li);
            });

            document.getElementById('total-crimes').innerText = VraiTotalGlobal;

            const ctx = document
                .getElementById('feurChart')
                .getContext('2d');

            if (feurChartInstance) {
                feurChartInstance.destroy();
            }

            feurChartInstance = new Chart(ctx, {
                type: 'radar',

                data: {
                    labels: [
                        'Quoi/Feur',
                        'Pourquoi',
                        'Sexuel',
                        'Raciste',
                        'Autre'
                    ],

                    datasets: [{
                        label: 'Infractions',

                        data: [
                            totalFeur,
                            totalPourquoi,
                            totalSexuel,
                            totalRaciste,
                            totalAutre
                        ],

                        backgroundColor: 'rgba(228, 63, 90, 0.25)',
                        borderColor: '#e43f5a',
                        borderWidth: 3,

                        pointBackgroundColor: '#e43f5a',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 5
                    }]
                },

                options: {
                    responsive: false,
                    maintainAspectRatio: true,

                    animation: false,

                    scales: {
                        r: {
                            beginAtZero: true,

                            angleLines: {
                                color: 'rgba(255,255,255,0.25)'
                            },

                            grid: {
                                color: 'rgba(255,255,255,0.2)'
                            },

                            pointLabels: {
                                color: '#ffffff',
                                font: {
                                    size: 13,
                                    weight: 'bold'
                                }
                            },

                            ticks: {
                                color: '#8a99ad',
                                backdropColor: 'transparent'
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });

        } catch (error) {
            console.error('Erreur:', error);

            document.getElementById('loading').innerText =
                "Impossible de charger les statistiques.";
        }
    }

    fetchStats();
 </script>

 <footer>
    <a href="/mentions-legales.html">Mentions légales</a>
    <a href="/confidentialite.html">Politique de confidentialité</a>
 </footer>
</body>
</html>
