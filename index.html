<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feur-Mania - Statistiques Détaillées</title>
    <!-- 📊 Importation de Chart.js pour le camembert -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        h1 { color: #e43f5a; margin-bottom: 5px; }
        .subtitle { color: #8a99ad; margin-bottom: 25px; font-size: 0.9em; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .counter-box {
            background-color: #1f4068;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .counter-box span { color: #e43f5a; font-size: 1.3em; margin-top: 5px; }
        .counter-box.aura span { color: #00d2fc; }

        /* Style du conteneur du Camembert */
        .chart-container {
            background-color: #1f4068;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 340px;
        }

        .ranking-list { list-style: none; padding: 0; margin: 0; text-align: left; }
        .ranking-item {
            display: flex;
            flex-direction: column;
            background-color: #1f4068;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .ranking-item:hover { transform: scale(1.01); }
        .main-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .rank { font-weight: bold; width: 25px; }
        .username { font-weight: bold; font-size: 1.1em; }
        .total-count { background-color: #e43f5a; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; }
        
        .details-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        .badge-feur { background-color: #4ecc71; color: #fff; }
        .badge-pourquoi { background-color: #3498db; color: #fff; }
        .badge-sexuel { background-color: #f1c40f; color: #000; }
        .badge-raciste { background-color: #e74c3c; color: #fff; }
        .badge-autre { background-color: #9b59b6; color: #fff; }
        .loading { color: #8a99ad; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 FEUR-MANIA</h1>
    <div class="subtitle">Le classement public et détaillé du serveur</div>

    <!-- Grille des compteurs globaux -->
    <div class="stats-grid">
        <div class="counter-box">
            🎯 Infractions globales
            <span id="total-crimes">0</span>
        </div>
        <div class="counter-box aura">
            👑 Aura Farmeur (+999 aura)
            <span id="aura-user">Personne...</span>
        </div>
    </div>

    <!-- Zone du graphique (Taille bloquée par sécurité) -->
    <h2>📊 Répartition des fautes</h2>
    <div class="chart-container">
        <canvas id="feurChart" width="300" height="300"></canvas>
    </div>

    <h2>🏆 Tableau des scores détaillé</h2>
    <div id="loading" class="loading">Chargement des statistiques...</div>
    <ul class="ranking-list" id="ranking-list"></ul>
</div>

<script>
    const API_URL = '/api/stats';
    let feurChartInstance = null;

    async function fetchStats() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            document.getElementById('loading').style.display = 'none';

            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            const medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"];
            let VraiTotalGlobal = 0;

            let totalFeur = 0;
            let totalPourquoi = 0;
            let totalSexuel = 0;
            let totalRaciste = 0;
            let totalAutre = 0;

            // 👑 Détermination de l'Aura Farmeur
            let auraUser = "Personne...";
            if (data.ranking && data.ranking.length > 0) {
                const lastUser = data.ranking[data.ranking.length - 1];
                auraUser = `${lastUser.username} (${lastUser.count} 🔥)`;
            }
            document.getElementById('aura-user').innerText = auraUser;

            data.ranking.forEach((user, index) => {
                VraiTotalGlobal += (user.count || 0);

                totalFeur += (user.feur || 0);
                totalPourquoi += (user.pourquoi || 0);
                totalSexuel += (user.sexuel || 0);
                totalRaciste += (user.raciste || 0);
                totalAutre += (user.autre || 0);

                const medal = medals[index] || "👤";
                const li = document.createElement('li');
                li.className = 'ranking-item';
                
                li.innerHTML = `
                    <div class="main-info">
                        <div class="user-info">
                            <span class="rank">${medal}</span>
                            <span class="username">${user.username}</span>
                        </div>
                        <span class="total-count">${user.count} fautes</span>
                    </div>
                    <div class="details-box">
                        <span class="badge badge-feur">🗣️ Quoi/Feur : ${user.feur}</span>
                        <span class="badge badge-pourquoi">❓ Pourquoi : ${user.pourquoi}</span>
                        <span class="badge badge-sexuel">🐷 Sexuel : ${user.sexuel}</span>
                        <span class="badge badge-raciste">🚨 Raciste : ${user.raciste}</span>
                        <span class="badge badge-autre">⚙️ Autre : ${user.autre}</span>
                    </div>
                `;
                list.appendChild(li);
            });

            document.getElementById('total-crimes').innerText = VraiTotalGlobal;

            // 📊 Génération ou mise à jour du graphique Chart.js
            const ctx = document.getElementById('feurChart').getContext('2d');
            
            if (feurChartInstance) {
                feurChartInstance.destroy();
            }

            feurChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Quoi/Feur', 'Pourquoi', 'Sexuel', 'Raciste', 'Autre'],
                    datasets: [{
                        data: [totalFeur, totalPourquoi, totalSexuel, totalRaciste, totalAutre],
                        backgroundColor: ['#4ecc71', '#3498db', '#f1c40f', '#e74c3c', '#9b59b6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: false, // 🛠️ Bloque la taille du canvas à 300x300px stricte
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#ffffff' }
                        }
                    }
                }
            });

        } catch (error) {
            console.error('Erreur:', error);
            document.getElementById('loading').innerText = "Impossible de charger les statistiques.";
        }
    }

    fetchStats();
</script>
</body>
</html>
