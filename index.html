<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feur-Mania - Statistiques Détaillées</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #e43f5a; margin-bottom: 5px; }
        .subtitle { color: #8a99ad; margin-bottom: 25px; font-size: 0.9em; }
        .counter-box {
            background-color: #1f4068;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .counter-box span { color: #e43f5a; }
        .ranking-list { list-style: none; padding: 0; margin: 0; text-align: left; }
        .ranking-item {
            display: flex;
            flex-direction: column;
            background-color: #1f4068;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .ranking-item:hover { transform: scale(1.01); }
        .main-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .rank { font-weight: bold; width: 25px; }
        .username { font-weight: bold; font-size: 1.1em; }
        .total-count { background-color: #e43f5a; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; }
        
        /* Badges de détails */
        .details-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        .badge-feur { background-color: #4ecc71; color: #fff; }
        .badge-pourquoi { background-color: #3498db; color: #fff; }
        .badge-sexuel { background-color: #f1c40f; color: #000; }
        .badge-raciste { background-color: #e74c3c; color: #fff; }
        .badge-autre { background-color: #9b59b6; color: #fff; }
        .loading { color: #8a99ad; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 FEUR-MANIA</h1>
    <div class="subtitle">Le classement public et détaillé du serveur</div>

    <div class="counter-box">
        Total d'infractions enregistrées : <span id="total-crimes">0</span> 🎯
    </div>

    <h2>🏆 Tableau des scores détaillé</h2>
    <div id="loading" class="loading">Chargement des statistiques...</div>
    <ul class="ranking-list" id="ranking-list"></ul>
</div>

<script>
    const API_URL = 'https://bot-feur-3qcy.onrender.com/';

    async function fetchStats() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            document.getElementById('loading').style.display = 'none';

            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            const medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"];
            let VraiTotalGlobal = 0; // 🛠️ Variable pour recalculer proprement le total sans bug

            data.ranking.forEach((user, index) => {
                // On additionne les fautes de chaque utilisateur au compteur global
                VraiTotalGlobal += (user.count || 0);

                const medal = medals[index] || "👤";
                const li = document.createElement('li');
                li.className = 'ranking-item';
                
                li.innerHTML = `
                    <div class="main-info">
                        <div class="user-info">
                            <span class="rank">${medal}</span>
                            <span class="username">${user.username}</span>
                        </div>
                        <span class="total-count">${user.count} fautes</span>
                    </div>
                    <div class="details-box">
                        <span class="badge badge-feur">🗣️ Quoi/Feur : ${user.feur}</span>
                        <span class="badge badge-pourquoi">❓ Pourquoi : ${user.pourquoi}</span>
                        <span class="badge badge-sexuel">🐷 Sexuel : ${user.sexuel}</span>
                        <span class="badge badge-raciste">🚨 Raciste : ${user.raciste}</span>
                        <span class="badge badge-autre">⚙️ Autre : ${user.autre}</span>
                    </div>
                `;
                list.appendChild(li);
            });

            // 🛠️ On applique le vrai calcul mathématique au compteur en haut
            document.getElementById('total-crimes').innerText = VraiTotalGlobal;

        } catch (error) {
            console.error('Erreur:', error);
            document.getElementById('loading').innerText = "Impossible de charger les statistiques.";
        }
    }

    fetchStats();
</script>
</body>
</html>
